name: Update SG Oftersheim Kalender

on:
  schedule:
    - cron: "0 6 * * *"   # jeden Tag um 06:00 Uhr
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 ics

      - name: Run calendar generator
        run: |
          python generate_calendars.py
